<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CicloRecreoVía · Panel de DASHBOARDS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#eef7fb;
    --card:#ffffff;
    --line:#dceaf2;
    --sun:#ffc93c;
    --sun-dark:#c98d00;
    --sky:#2ba8d9;
    --sky-dark:#1a7fa8;
    --grass:#4caf6e;
    --grass-dark:#2f7d4b;
    --coral:#f2704f;
    --text-hi:#1f2d3a;
    --text-mid:#5a6b78;
    --text-low:#8ea0ac;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .crv-app{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text-hi);
    min-height:100vh;
    padding:0 0 4rem;
  }
  .crv-header{
    padding:1.6rem 1.5rem 1.3rem;
    text-align:center;
    background:var(--sky);
    position:relative;
    overflow:hidden;
  }
  .crv-header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:8px;
    background:repeating-linear-gradient(90deg,var(--sun) 0 24px, var(--card) 24px 48px);
  }
  .crv-header h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-size:clamp(24px,4.2vw,36px);
    margin:0;
    color:#ffffff;
  }
  .crv-header h1 span{color:var(--sun);}
  .crv-header p{
    margin:.3rem 0 0;
    color:#eaf7ff;
    font-size:14px;
  }
  .crv-main{
    max-width:960px;
    margin:0 auto;
    padding:1.2rem 1.5rem 0;
  }
  .crv-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:.8rem;
  }
  .crv-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:.8rem 1.1rem .9rem;
    box-shadow:0 2px 0 var(--line);
  }
  .crv-card h2{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:30px;
    text-transform:uppercase;
    letter-spacing:.4px;
    margin:0 0 .4rem;
    color:var(--sky-dark);
    text-align:center;
  }
  .crv-item-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:.3rem .1rem;
    border-bottom:1px solid var(--line);
  }
  .crv-item-row:last-child{border-bottom:none;}
  .crv-item{
    flex:1;
    color:var(--text-hi);
    text-decoration:none;
    font-size:17px;
    line-height:1.35;
    font-weight:500;
  }
  .crv-item:hover{color:var(--sky-dark);}
  .crv-bullet{
    flex:none;
    width:20px;height:20px;
    border-radius:50%;
    border:2px solid var(--grass);
    background:#eaf8ee;
    cursor:pointer;
    padding:0;
  }
  .crv-bullet:hover{background:var(--grass);}
  .crv-empty{
    color:var(--text-low);
    font-size:14px;
    font-style:italic;
    padding:.4rem 0;
    text-align:center;
  }
  .crv-loading{
    grid-column:1/-1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:var(--text-mid);
    font-size:15px;
    padding:2.5rem 1rem;
  }
  .crv-loading::before{
    content:"";
    width:18px;height:18px;
    border-radius:50%;
    border:3px solid var(--line);
    border-top-color:var(--sky);
    animation:crv-spin .8s linear infinite;
  }
  @keyframes crv-spin{ to{ transform:rotate(360deg); } }
  .crv-edit-row{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:.6rem .1rem;
    width:100%;
  }
  .crv-edit-row input{
    background:#f7fbfd;
    border:1px solid var(--sky);
    color:var(--text-hi);
    padding:8px 10px;
    border-radius:8px;
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  .crv-edit-actions{display:flex;gap:8px;margin-top:2px;}
  .crv-edit-actions button{
    font-size:13px;
    padding:6px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--text-hi);
    cursor:pointer;
    font-weight:500;
  }
  .crv-edit-actions button.save{border-color:var(--grass);color:var(--grass-dark);background:#eaf8ee;}
  .crv-edit-actions button.cancel{border-color:var(--coral);color:var(--coral);}

  .crv-form-section{
    max-width:960px;
    margin:1.6rem auto 0;
    padding:0 1.5rem;
    display:none;
  }
  .crv-form-section h3{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    font-size:15px;
    letter-spacing:.5px;
    color:var(--sky-dark);
    margin:0 0 .9rem;
    text-align:center;
  }
  .crv-form{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:1.3rem;
    display:grid;
    gap:.9rem;
    box-shadow:0 2px 0 var(--line);
  }
  .crv-form label{
    font-size:12px;
    color:var(--text-mid);
    display:block;
    margin-bottom:4px;
    text-transform:uppercase;
    letter-spacing:.4px;
    font-weight:500;
  }
  .crv-form select,.crv-form input[type=text],.crv-form input[type=url]{
    width:100%;
    background:#f7fbfd;
    border:1px solid var(--line);
    color:var(--text-hi);
    padding:10px 11px;
    border-radius:8px;
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  .crv-form select:focus,.crv-form input:focus{outline:none;border-color:var(--sky);}
  .crv-form button.crv-submit{
    justify-self:center;
    background:var(--sun);
    color:#5a3d00;
    border:none;
    font-weight:600;
    padding:11px 26px;
    border-radius:9px;
    cursor:pointer;
    font-size:15px;
  }
  .crv-form button.crv-submit:hover{filter:brightness(1.05);}
  .crv-msg{font-size:13px;min-height:16px;text-align:center;}
  .crv-msg.ok{color:var(--grass-dark);}
  .crv-msg.err{color:var(--coral);}

  .crv-pin-section{
    max-width:960px;
    margin:1.6rem auto 0;
    padding:1rem 1.5rem 0;
    text-align:center;
  }
  .crv-pin-keys{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:.6rem;
    flex-wrap:wrap;
  }
  .crv-pin-key{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:20px;
    width:48px;height:48px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--sky-dark);
    cursor:pointer;
  }
  .crv-pin-key:active{transform:scale(.94);}
  .crv-pin-status{
    margin-top:.8rem;
    font-size:12px;
    color:var(--text-low);
    letter-spacing:.4px;
  }
  .crv-pin-status.unlocked{color:var(--grass-dark);font-weight:500;}
  .crv-dots{display:flex;justify-content:center;gap:6px;margin-top:.6rem;}
  .crv-dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
  .crv-dot.filled{background:var(--sky);}
  .crv-storage-warning{
    display:none;
    max-width:960px;
    margin:1rem auto 0;
    padding:.8rem 1.1rem;
    background:#fff3e6;
    border:1px solid var(--coral);
    color:#8a3b1f;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
  }
</style>
</head>
<body>
<div class="crv-app">

  <div class="crv-header">
    <h1>CicloRecreo<span>Vía</span>. Panel de DASHBOARDS</h1>
    <p>Enlaces internos organizados por categoría</p>
  </div>

  <div id="crv-storage-warning" class="crv-storage-warning"></div>

  <div class="crv-main">
    <div id="crv-grid" class="crv-grid">
      <div class="crv-loading">Cargando enlaces desde la planilla…</div>
    </div>
  </div>

  <div class="crv-form-section" id="crv-form-section">
    <h3>Agregar nuevo enlace</h3>
    <div class="crv-form">
      <div>
        <label>Categoría</label>
        <select id="crv-cat-select"></select>
      </div>
      <div id="crv-new-cat-wrap" style="display:none;">
        <label>Nombre de la nueva categoría</label>
        <input type="text" id="crv-new-cat-input" placeholder="Ej: Encuestas">
      </div>
      <div>
        <label>Texto (descriptor)</label>
        <input type="text" id="crv-text-input" placeholder="Ej: Dashboard asistencia junio">
      </div>
      <div>
        <label>Enlace</label>
        <input type="url" id="crv-url-input" placeholder="https://...">
      </div>
      <button class="crv-submit" id="crv-submit-btn">Agregar</button>
      <div class="crv-msg" id="crv-msg"></div>
    </div>
  </div>

  <div class="crv-pin-section">
    <div class="crv-pin-keys" id="crv-pin-keys"></div>
    <div class="crv-dots" id="crv-dots"></div>
    <div class="crv-pin-status" id="crv-pin-status">Ingresa la clave para habilitar edición</div>
  </div>

</div>

<script>
(function(){
  var PIN_CODE = ['P','L','A','E','N'];
  var data = { categories: {} };
  var unlocked = false;
  var pinBuffer = [];

  var grid = document.getElementById('crv-grid');
  var catSelect = document.getElementById('crv-cat-select');
  var newCatWrap = document.getElementById('crv-new-cat-wrap');
  var newCatInput = document.getElementById('crv-new-cat-input');
  var textInput = document.getElementById('crv-text-input');
  var urlInput = document.getElementById('crv-url-input');
  var submitBtn = document.getElementById('crv-submit-btn');
  var msg = document.getElementById('crv-msg');
  var pinKeysWrap = document.getElementById('crv-pin-keys');
  var dotsWrap = document.getElementById('crv-dots');
  var pinStatus = document.getElementById('crv-pin-status');
  var storageWarning = document.getElementById('crv-storage-warning');
  var formSection = document.getElementById('crv-form-section');
  var headerEl = document.querySelector('.crv-header');

  var HEADER_COLORS = ['#2ba8d9','#43a047','#ef6c4d','#8859c9','#e0a11f'];
  var headerColorIdx = 0;

  function cycleHeaderColor(){
    var next;
    do{ next = Math.floor(Math.random() * HEADER_COLORS.length); }while(next === headerColorIdx && HEADER_COLORS.length > 1);
    headerColorIdx = next;
    headerEl.style.background = HEADER_COLORS[headerColorIdx];
  }

  function showStorageWarning(detail){
    storageWarning.textContent = 'No se pudo conectar con el almacenamiento persistente, por lo que los cambios podrían no guardarse. Detalle técnico: ' + detail;
    storageWarning.style.display = 'block';
  }
  function hideStorageWarning(){
    storageWarning.style.display = 'none';
  }

  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyYLwXx8PscxdGucVddUz4XPyqfOopdft2FpIfVokOyjwBQ8k4kuv3PP-ZOZYRh6g13jg/exec';
  var SHEET_ID = '161Qa2RyqmHrlpdvmgpKxKWZBoAhh6Eh6rkkfXLJFStg';
  var SHEET_NAME = 'Datos';
  var GVIZ_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent(SHEET_NAME) + '&headers=1';

  function uid(){ return 'i' + Math.random().toString(36).slice(2,9); }

  function parseGvizResponse(text){
    var start = text.indexOf('(');
    var end = text.lastIndexOf(')');
    var jsonStr = text.substring(start + 1, end);
    var parsed = JSON.parse(jsonStr);
    var rows = (parsed.table && parsed.table.rows) || [];
    var categories = {};
    rows.forEach(function(r, idx){
      var c = r.c || [];
      var id = c[0] && c[0].v;
      var cat = c[1] && c[1].v;
      var text_ = c[2] && c[2].v;
      var url = c[3] && c[3].v;
      if(!cat) return;
      if(!id) id = 'fila-' + (idx + 2);
      if(!categories[cat]) categories[cat] = [];
      categories[cat].push({ id: String(id), text: text_, url: url });
    });
    return { categories: categories };
  }

  async function fetchRemote(){
    try{
      var res = await fetch(GVIZ_URL);
      var text = await res.text();
      var payload = parseGvizResponse(text);
      hideStorageWarning();
      return payload;
    }catch(e){
      showStorageWarning((e && e.message) ? e.message : String(e));
      return null;
    }
  }

  async function load(){
    var remote = await fetchRemote();
    if(remote !== null){
      data = remote;
    }
    render();
  }

  async function postToSheet(body){
    if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PEGA_AQUI') === 0){
      showStorageWarning('Falta configurar APPS_SCRIPT_URL con la URL de tu implementación de Apps Script.');
      showMsg('No se pudo guardar: falta configurar la conexión con la planilla.', true);
      return false;
    }
    try{
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      });
      hideStorageWarning();
      return true;
    }catch(e){
      var detail = (e && e.message) ? e.message : String(e);
      showStorageWarning(detail);
      showMsg('No se pudo guardar. Detalle: ' + detail, true);
      return false;
    }
  }

  function showMsg(text, isErr){
    msg.textContent = text;
    msg.className = 'crv-msg ' + (isErr ? 'err' : 'ok');
    setTimeout(function(){ msg.textContent=''; msg.className='crv-msg'; }, 3500);
  }

  function renderCatSelect(){
    var cats = Object.keys(data.categories);
    catSelect.innerHTML = '';
    cats.forEach(function(c){
      var opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      catSelect.appendChild(opt);
    });
    var optNew = document.createElement('option');
    optNew.value = '__new__';
    optNew.textContent = '+ Nueva categoría';
    catSelect.appendChild(optNew);
    if(cats.length === 0){ catSelect.value = '__new__'; }
    toggleNewCatField();
  }

  function toggleNewCatField(){
    newCatWrap.style.display = (catSelect.value === '__new__') ? 'block' : 'none';
  }
  catSelect.addEventListener('change', toggleNewCatField);

  function render(){
    renderCatSelect();
    grid.innerHTML = '';
    var cats = Object.keys(data.categories);
    if(cats.length === 0){
      var emptyCard = document.createElement('div');
      emptyCard.className = 'crv-card';
      emptyCard.innerHTML = '<h2>Sin categorías aún</h2><p class="crv-empty">Agrega la primera categoría con el formulario de más abajo.</p>';
      grid.appendChild(emptyCard);
      return;
    }
    cats.forEach(function(catName){
      var card = document.createElement('div');
      card.className = 'crv-card';
      var h2 = document.createElement('h2');
      h2.textContent = catName;
      card.appendChild(h2);
      var items = data.categories[catName];
      if(!items || items.length === 0){
        var p = document.createElement('div');
        p.className = 'crv-empty';
        p.textContent = 'Sin enlaces en esta categoría todavía.';
        card.appendChild(p);
      }else{
        items.forEach(function(item){
          card.appendChild(buildItemRow(catName, item));
        });
      }
      grid.appendChild(card);
    });
  }

  function buildItemRow(catName, item){
    var row = document.createElement('div');
    row.className = 'crv-item-row';

    if(unlocked){
      var bullet = document.createElement('button');
      bullet.className = 'crv-bullet';
      bullet.setAttribute('aria-label', 'Editar ' + item.text);
      bullet.addEventListener('click', function(){
        enterEditMode(catName, item, row);
      });
      row.appendChild(bullet);
    }

    var a = document.createElement('a');
    a.className = 'crv-item';
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = item.text;
    row.appendChild(a);

    return row;
  }

  function enterEditMode(catName, item, rowEl){
    var wrap = document.createElement('div');
    wrap.className = 'crv-edit-row';

    var textIn = document.createElement('input');
    textIn.type = 'text'; textIn.value = item.text;
    var urlIn = document.createElement('input');
    urlIn.type = 'url'; urlIn.value = item.url;

    var actions = document.createElement('div');
    actions.className = 'crv-edit-actions';
    var saveBtn = document.createElement('button');
    saveBtn.className = 'save'; saveBtn.textContent = 'Guardar';
    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'cancel'; cancelBtn.textContent = 'Cancelar';
    actions.appendChild(saveBtn);
    actions.appendChild(cancelBtn);

    wrap.appendChild(textIn);
    wrap.appendChild(urlIn);
    wrap.appendChild(actions);

    rowEl.replaceWith(wrap);

    saveBtn.addEventListener('click', async function(){
      var newText = textIn.value.trim() || item.text;
      var newUrl = urlIn.value.trim() || item.url;
      var ok = await postToSheet({ action: 'edit', id: item.id, text: newText, url: newUrl });
      if(ok){
        showMsg('Enlace actualizado.', false);
        cycleHeaderColor();
        await load();
      }else{
        render();
      }
    });
    cancelBtn.addEventListener('click', function(){
      render();
    });
  }

  submitBtn.addEventListener('click', async function(){
    var catValue = catSelect.value;
    var finalCat;
    if(catValue === '__new__'){
      finalCat = newCatInput.value.trim();
      if(!finalCat){ showMsg('Ingresa un nombre de categoría.', true); return; }
    }else{
      finalCat = catValue;
    }
    var text = textInput.value.trim();
    var url = urlInput.value.trim();
    if(!text || !url){ showMsg('Completa el texto y el enlace.', true); return; }

    var newId = uid();
    var ok = await postToSheet({ action: 'add', id: newId, category: finalCat, text: text, url: url });
    textInput.value = '';
    urlInput.value = '';
    newCatInput.value = '';
    if(ok){
      showMsg('Enlace agregado.', false);
      cycleHeaderColor();
      await load();
    }else{
      render();
    }
    catSelect.value = finalCat;
    toggleNewCatField();
  });

  var letters = ['P','A','N','E','L'];
  letters.forEach(function(l){
    var btn = document.createElement('button');
    btn.className = 'crv-pin-key';
    btn.textContent = l;
    btn.addEventListener('click', function(){ handlePin(l); });
    pinKeysWrap.appendChild(btn);
  });
  for(var i=0;i<5;i++){
    var d = document.createElement('div');
    d.className = 'crv-dot';
    dotsWrap.appendChild(d);
  }

  function updateDots(){
    var dots = dotsWrap.children;
    for(var i=0;i<dots.length;i++){
      dots[i].className = 'crv-dot' + (i < pinBuffer.length ? ' filled' : '');
    }
  }

  function handlePin(letter){
    if(unlocked) return;
    pinBuffer.push(letter);
    if(pinBuffer.length > 5) pinBuffer.shift();
    updateDots();
    if(pinBuffer.length === 5){
      var match = pinBuffer.every(function(l,i){ return l === PIN_CODE[i]; });
      if(match){
        unlocked = true;
        pinStatus.textContent = 'Edición habilitada: presiona el punto junto a un texto para editarlo.';
        pinStatus.classList.add('unlocked');
        formSection.style.display = 'block';
        render();
      }else{
        pinBuffer = [];
        updateDots();
      }
    }
  }

  load();
})();
</script>
</body>
</html>
