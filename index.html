<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CicloRecreoVía · Panel de DASHBOARDS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --asphalt-0:#15181c;
    --asphalt-1:#1c2126;
    --asphalt-2:#252b31;
    --line-y:#f7c948;
    --line-y-dark:#8a6a12;
    --sky:#4fb3d9;
    --text-hi:#f2f1ec;
    --text-mid:#b7bcc2;
    --text-low:#767c84;
    --danger:#e05a4e;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .crv-app{
    font-family:'Inter',sans-serif;
    background:var(--asphalt-0);
    color:var(--text-hi);
    min-height:100vh;
    padding:0 0 4rem;
  }
  .crv-header{
    padding:2.5rem 1.5rem 2rem;
    text-align:center;
    border-bottom:3px dashed var(--line-y-dark);
    position:relative;
  }
  .crv-header h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-size:clamp(22px,4vw,34px);
    margin:0;
    color:var(--text-hi);
  }
  .crv-header h1 span{color:var(--line-y);}
  .crv-header p{
    margin:.5rem 0 0;
    color:var(--text-mid);
    font-size:14px;
  }
  .crv-main{
    max-width:920px;
    margin:0 auto;
    padding:2rem 1.5rem 0;
  }
  .crv-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:1.2rem;
  }
  .crv-card{
    background:var(--asphalt-1);
    border:1px solid #33393f;
    border-radius:10px;
    padding:1.1rem 1.2rem 1.3rem;
  }
  .crv-card h2{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:.6px;
    margin:0 0 .8rem;
    color:var(--sky);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .crv-card h2::before{
    content:"";
    width:10px;height:10px;border-radius:50%;
    background:var(--line-y);
    flex:none;
  }
  .crv-item{
    display:block;
    padding:.55rem .1rem;
    border-bottom:1px solid #2c3238;
    color:var(--text-hi);
    text-decoration:none;
    font-size:14px;
    line-height:1.4;
    -webkit-user-select:none;
    user-select:none;
    cursor:pointer;
    position:relative;
    border-radius:6px;
  }
  .crv-item:last-child{border-bottom:none;}
  .crv-item:hover{color:var(--line-y);}
  .crv-item.editing-target{background:#2c2410;}
  .crv-empty{
    color:var(--text-low);
    font-size:13px;
    font-style:italic;
    padding:.4rem 0;
  }
  .crv-edit-row{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:.5rem 0;
  }
  .crv-edit-row input{
    background:var(--asphalt-0);
    border:1px solid var(--sky);
    color:var(--text-hi);
    padding:6px 8px;
    border-radius:6px;
    font-size:13px;
    font-family:'Inter',sans-serif;
  }
  .crv-edit-actions{display:flex;gap:8px;margin-top:2px;}
  .crv-edit-actions button{
    font-size:12px;
    padding:5px 10px;
    border-radius:6px;
    border:1px solid #444;
    background:var(--asphalt-2);
    color:var(--text-hi);
    cursor:pointer;
  }
  .crv-edit-actions button.save{border-color:var(--line-y);color:var(--line-y);}
  .crv-edit-actions button.cancel{border-color:var(--danger);color:var(--danger);}

  .crv-form-section{
    max-width:920px;
    margin:2.5rem auto 0;
    padding:1.5rem 1.5rem 0;
    border-top:3px dashed var(--line-y-dark);
  }
  .crv-form-section h3{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    font-size:14px;
    letter-spacing:.6px;
    color:var(--text-mid);
    margin:1.2rem 0 .8rem;
  }
  .crv-form{
    background:var(--asphalt-1);
    border:1px solid #33393f;
    border-radius:10px;
    padding:1.2rem;
    display:grid;
    gap:.8rem;
  }
  .crv-form label{
    font-size:12px;
    color:var(--text-mid);
    display:block;
    margin-bottom:4px;
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .crv-form select,.crv-form input[type=text],.crv-form input[type=url]{
    width:100%;
    background:var(--asphalt-0);
    border:1px solid #3c434a;
    color:var(--text-hi);
    padding:9px 10px;
    border-radius:7px;
    font-size:14px;
    font-family:'Inter',sans-serif;
  }
  .crv-form select:focus,.crv-form input:focus{outline:none;border-color:var(--sky);}
  .crv-form button.crv-submit{
    justify-self:start;
    background:var(--line-y);
    color:#3a2c00;
    border:none;
    font-weight:600;
    padding:10px 20px;
    border-radius:7px;
    cursor:pointer;
    font-size:14px;
  }
  .crv-form button.crv-submit:hover{filter:brightness(1.08);}
  .crv-msg{font-size:13px;min-height:16px;}
  .crv-msg.ok{color:#8fd694;}
  .crv-msg.err{color:var(--danger);}

  .crv-pin-section{
    max-width:920px;
    margin:2.5rem auto 0;
    padding:1.5rem;
    text-align:center;
  }
  .crv-pin-keys{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:.6rem;
    flex-wrap:wrap;
  }
  .crv-pin-key{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:20px;
    width:46px;height:46px;
    border-radius:8px;
    border:1px solid #3c434a;
    background:var(--asphalt-1);
    color:var(--text-hi);
    cursor:pointer;
  }
  .crv-pin-key:active{transform:scale(.94);}
  .crv-pin-status{
    margin-top:.7rem;
    font-size:12px;
    color:var(--text-low);
    letter-spacing:.5px;
  }
  .crv-pin-status.unlocked{color:var(--line-y);}
  .crv-dots{display:flex;justify-content:center;gap:6px;margin-top:.5rem;}
  .crv-dot{width:8px;height:8px;border-radius:50%;background:#3c434a;}
  .crv-dot.filled{background:var(--sky);}
</style>
</head>
<body>
<div class="crv-app">

  <div class="crv-header">
    <h1>CicloRecreo<span>Vía</span>. Panel de DASHBOARDS</h1>
    <p>Enlaces internos organizados por categoría</p>
  </div>

  <div class="crv-main">
    <div id="crv-grid" class="crv-grid"></div>
  </div>

  <div class="crv-form-section">
    <h3>Agregar nuevo enlace</h3>
    <div class="crv-form">
      <div>
        <label>Categoría</label>
        <select id="crv-cat-select"></select>
      </div>
      <div id="crv-new-cat-wrap" style="display:none;">
        <label>Nombre de la nueva categoría</label>
        <input type="text" id="crv-new-cat-input" placeholder="Ej: Encuestas">
      </div>
      <div>
        <label>Texto (descriptor)</label>
        <input type="text" id="crv-text-input" placeholder="Ej: Dashboard asistencia junio">
      </div>
      <div>
        <label>Enlace</label>
        <input type="url" id="crv-url-input" placeholder="https://...">
      </div>
      <button class="crv-submit" id="crv-submit-btn">Agregar</button>
      <div class="crv-msg" id="crv-msg"></div>
    </div>
  </div>

  <div class="crv-pin-section">
    <div class="crv-pin-keys" id="crv-pin-keys"></div>
    <div class="crv-dots" id="crv-dots"></div>
    <div class="crv-pin-status" id="crv-pin-status">Ingresa la clave para habilitar edición (mantén presionado un texto 5s)</div>
  </div>

</div>

<script>
(function(){
  var STORAGE_KEY = 'crv-panel-data';
  var PIN_CODE = ['P','L','A','E','N'];
  var data = { categories: {} };
  var unlocked = false;
  var pinBuffer = [];

  var grid = document.getElementById('crv-grid');
  var catSelect = document.getElementById('crv-cat-select');
  var newCatWrap = document.getElementById('crv-new-cat-wrap');
  var newCatInput = document.getElementById('crv-new-cat-input');
  var textInput = document.getElementById('crv-text-input');
  var urlInput = document.getElementById('crv-url-input');
  var submitBtn = document.getElementById('crv-submit-btn');
  var msg = document.getElementById('crv-msg');
  var pinKeysWrap = document.getElementById('crv-pin-keys');
  var dotsWrap = document.getElementById('crv-dots');
  var pinStatus = document.getElementById('crv-pin-status');

  function uid(){ return 'i' + Math.random().toString(36).slice(2,9); }

  async function load(){
    try{
      var res = await window.storage.get(STORAGE_KEY, true);
      if(res && res.value){
        var parsed = JSON.parse(res.value);
        if(parsed && parsed.categories) data = parsed;
      }
    }catch(e){
      data = { categories: {} };
    }
    render();
  }

  async function save(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(data), true);
    }catch(e){
      showMsg('No se pudo guardar. Intenta nuevamente.', true);
    }
  }

  function showMsg(text, isErr){
    msg.textContent = text;
    msg.className = 'crv-msg ' + (isErr ? 'err' : 'ok');
    setTimeout(function(){ msg.textContent=''; msg.className='crv-msg'; }, 3500);
  }

  function renderCatSelect(){
    var cats = Object.keys(data.categories);
    catSelect.innerHTML = '';
    cats.forEach(function(c){
      var opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      catSelect.appendChild(opt);
    });
    var optNew = document.createElement('option');
    optNew.value = '__new__';
    optNew.textContent = '+ Nueva categoría';
    catSelect.appendChild(optNew);
    if(cats.length === 0){ catSelect.value = '__new__'; }
    toggleNewCatField();
  }

  function toggleNewCatField(){
    newCatWrap.style.display = (catSelect.value === '__new__') ? 'block' : 'none';
  }
  catSelect.addEventListener('change', toggleNewCatField);

  function render(){
    renderCatSelect();
    grid.innerHTML = '';
    var cats = Object.keys(data.categories);
    if(cats.length === 0){
      var emptyCard = document.createElement('div');
      emptyCard.className = 'crv-card';
      emptyCard.innerHTML = '<h2>Sin categorías aún</h2><p class="crv-empty">Agrega la primera categoría con el formulario de más abajo.</p>';
      grid.appendChild(emptyCard);
      return;
    }
    cats.forEach(function(catName){
      var card = document.createElement('div');
      card.className = 'crv-card';
      var h2 = document.createElement('h2');
      h2.textContent = catName;
      card.appendChild(h2);
      var items = data.categories[catName];
      if(!items || items.length === 0){
        var p = document.createElement('div');
        p.className = 'crv-empty';
        p.textContent = 'Sin enlaces en esta categoría todavía.';
        card.appendChild(p);
      }else{
        items.forEach(function(item){
          card.appendChild(buildItemEl(catName, item));
        });
      }
      grid.appendChild(card);
    });
  }

  function buildItemEl(catName, item){
    var a = document.createElement('a');
    a.className = 'crv-item';
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = item.text;
    a.dataset.id = item.id;

    var pressTimer = null;
    var longPressed = false;

    function startPress(e){
      longPressed = false;
      pressTimer = setTimeout(function(){
        if(unlocked){
          longPressed = true;
          enterEditMode(catName, item, a);
        }
      }, 5000);
    }
    function cancelPress(){
      if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
    }
    function onClick(e){
      if(longPressed){ e.preventDefault(); }
    }

    a.addEventListener('mousedown', startPress);
    a.addEventListener('touchstart', startPress, {passive:true});
    a.addEventListener('mouseup', cancelPress);
    a.addEventListener('mouseleave', cancelPress);
    a.addEventListener('touchend', cancelPress);
    a.addEventListener('touchcancel', cancelPress);
    a.addEventListener('click', onClick);

    return a;
  }

  function enterEditMode(catName, item, anchorEl){
    var wrap = document.createElement('div');
    wrap.className = 'crv-edit-row';

    var textIn = document.createElement('input');
    textIn.type = 'text'; textIn.value = item.text;
    var urlIn = document.createElement('input');
    urlIn.type = 'url'; urlIn.value = item.url;

    var actions = document.createElement('div');
    actions.className = 'crv-edit-actions';
    var saveBtn = document.createElement('button');
    saveBtn.className = 'save'; saveBtn.textContent = 'Guardar';
    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'cancel'; cancelBtn.textContent = 'Cancelar';
    actions.appendChild(saveBtn);
    actions.appendChild(cancelBtn);

    wrap.appendChild(textIn);
    wrap.appendChild(urlIn);
    wrap.appendChild(actions);

    anchorEl.replaceWith(wrap);

    saveBtn.addEventListener('click', async function(){
      item.text = textIn.value.trim() || item.text;
      item.url = urlIn.value.trim() || item.url;
      await save();
      render();
    });
    cancelBtn.addEventListener('click', function(){
      render();
    });
  }

  submitBtn.addEventListener('click', async function(){
    var catValue = catSelect.value;
    var finalCat;
    if(catValue === '__new__'){
      finalCat = newCatInput.value.trim();
      if(!finalCat){ showMsg('Ingresa un nombre de categoría.', true); return; }
    }else{
      finalCat = catValue;
    }
    var text = textInput.value.trim();
    var url = urlInput.value.trim();
    if(!text || !url){ showMsg('Completa el texto y el enlace.', true); return; }

    if(!data.categories[finalCat]) data.categories[finalCat] = [];
    data.categories[finalCat].push({ id: uid(), text: text, url: url });
    await save();
    textInput.value = '';
    urlInput.value = '';
    newCatInput.value = '';
    render();
    catSelect.value = finalCat;
    toggleNewCatField();
    showMsg('Enlace agregado.', false);
  });

  var letters = ['P','A','N','E','L'];
  letters.forEach(function(l){
    var btn = document.createElement('button');
    btn.className = 'crv-pin-key';
    btn.textContent = l;
    btn.addEventListener('click', function(){ handlePin(l); });
    pinKeysWrap.appendChild(btn);
  });
  for(var i=0;i<5;i++){
    var d = document.createElement('div');
    d.className = 'crv-dot';
    dotsWrap.appendChild(d);
  }

  function updateDots(){
    var dots = dotsWrap.children;
    for(var i=0;i<dots.length;i++){
      dots[i].className = 'crv-dot' + (i < pinBuffer.length ? ' filled' : '');
    }
  }

  function handlePin(letter){
    if(unlocked) return;
    pinBuffer.push(letter);
    if(pinBuffer.length > 5) pinBuffer.shift();
    updateDots();
    if(pinBuffer.length === 5){
      var match = pinBuffer.every(function(l,i){ return l === PIN_CODE[i]; });
      if(match){
        unlocked = true;
        pinStatus.textContent = 'Edición habilitada: mantén presionado un texto 5s para editarlo.';
        pinStatus.classList.add('unlocked');
      }else{
        pinBuffer = [];
        updateDots();
      }
    }
  }

  load();
})();
</script>
</body>
</html>
